<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="냉장고에 있는 재료로 오늘 뭘 해 먹을지 골라 줍니다.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="냉장고">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <title>하야의 냉장고</title>
  <style>
    :root{
      --paper:#F5F8F3;
      --surface:#FFFFFF;
      --ink:#1B2620;
      --ink-soft:#6E7D73;
      --ink-faint:#A3AEA6;
      --line:#E5EBE1;
      --line-soft:#F0F4EE;
      --green:#3E7D52;
      --green-tint:#EDF5EF;
      --omija:#C4394F;
      --amber:#DD9B33;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      font-family:'IBM Plex Sans KR',sans-serif;
      background:var(--paper);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
      overscroll-behavior:none;
    }
    .app{
      max-width:480px;margin:0 auto;height:100vh;height:100dvh;
      padding-bottom:env(safe-area-inset-bottom);
      background:var(--surface);display:flex;flex-direction:column;
      position:relative;overflow:hidden;
    }

    /* ── 탭 바 ── */
    .tabs{display:flex;flex:none;background:var(--surface);border-bottom:1px solid var(--line);
      padding-top:env(safe-area-inset-top)}
    .tabs button{
      flex:1;padding:15px 0 12px;border:none;background:none;cursor:pointer;
      font-family:inherit;font-size:12.5px;font-weight:400;color:var(--ink-soft);
      border-bottom:2px solid transparent;transition:color .2s,border-color .2s;
    }
    .tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--omija)}

    /* ── 패널 ── */
    .panel{display:none;flex:1;min-height:0;flex-direction:column}
    .panel.on{display:flex}
    .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .sticky{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px}

    /* ── 입력 ── */
    .field{
      display:flex;align-items:center;gap:10px;
      border:1px solid var(--line);border-radius:12px;padding:11px 14px;
      background:var(--surface);transition:border-color .2s;
    }
    .field:focus-within{border-color:var(--green)}
    .field input{
      flex:1;border:none;outline:none;background:none;
      font-family:inherit;font-size:13.5px;color:var(--ink);min-width:0;
    }
    .field input::placeholder{color:var(--ink-faint);font-weight:300}
    .field .icon{font-size:13px;color:var(--ink-faint);flex:none}
    .field .add{
      font-style:normal;font-size:19px;line-height:1;color:var(--green);
      font-weight:600;cursor:pointer;flex:none;padding:0 2px;user-select:none;
    }

    /* ── 카테고리 칩 ── */
    .picker{display:flex;flex-direction:column;gap:7px;margin-top:11px}
    .row{display:flex;align-items:center;gap:9px;min-width:0}
    .rowname{
      flex:none;font-size:10.5px;font-weight:600;color:var(--ink-faint);
      letter-spacing:.06em;white-space:nowrap;width:26px;
    }
    .chips{
      display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;position:relative;
      scrollbar-width:none;-webkit-overflow-scrolling:touch;
    }
    .chips::-webkit-scrollbar{display:none}
    .chip{
      flex:none;padding:5px 11px;border-radius:20px;cursor:pointer;
      font-size:11.5px;font-weight:400;white-space:nowrap;
      border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);
      transition:background .15s,color .15s,border-color .15s;user-select:none;
    }
    .chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}

    /* ── 섹션 라벨 ── */
    .label{
      display:flex;align-items:center;gap:8px;
      font-size:10.5px;letter-spacing:.18em;color:var(--green);font-weight:600;
      padding:20px 16px 10px;
    }
    .label .clear{
      margin-left:auto;letter-spacing:0;font-size:11px;font-weight:400;
      color:var(--ink-faint);cursor:pointer;text-decoration:underline;
    }

    .notice{
      margin:0 16px 12px;padding:10px 13px;border-radius:10px;
      background:var(--paper);border:1px solid var(--line);
      font-size:11.5px;font-weight:300;color:var(--ink-soft);line-height:1.6;
    }

    /* ── 추천 카드 ── */
    .cards{padding:0 16px 8px;display:flex;flex-direction:column;gap:10px}
    .card{
      border:1px solid var(--line);border-left:3px solid var(--green);
      border-radius:14px;padding:15px 16px;cursor:pointer;background:var(--surface);
      transition:box-shadow .2s,transform .1s;
    }
    .card:active{transform:scale(.99)}
    .card:hover{box-shadow:0 3px 14px -6px rgba(27,38,32,.22)}
    .card h3{font-family:'Gowun Batang',serif;font-size:17.5px;font-weight:700;margin-bottom:6px}
    .card .meta{display:flex;gap:14px;font-size:11.5px;color:var(--ink-soft);font-weight:300}
    .card .tag{
      display:inline-block;margin-top:8px;font-size:10px;font-weight:500;
      color:var(--green);background:var(--green-tint);
      padding:3px 8px;border-radius:20px;letter-spacing:.02em;
    }
    .btnrow{display:flex;gap:8px;margin:16px 16px 24px}
    .again{
      flex:1;padding:12px 0;
      border:1px solid var(--line);border-radius:11px;background:var(--surface);
      font-family:inherit;font-size:12.5px;font-weight:500;color:var(--green);cursor:pointer;
    }
    .again:active{background:var(--green-tint)}
    .surprise{
      flex:1;padding:12px 0;
      border:1px solid var(--line);border-radius:11px;background:var(--surface);
      font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;
    }
    .surprise:active{background:var(--paper)}
    .rcount{text-align:center;font-size:10px;font-weight:300;color:var(--ink-faint);padding:0 16px 22px}

    /* ── 냉장고 ── */
    .items{padding:4px 0 24px}
    .item{
      display:flex;justify-content:space-between;align-items:center;
      padding:13px 18px;border-bottom:1px solid var(--line-soft);font-size:14px;
    }
    .item .del{
      color:var(--ink-faint);font-size:17px;line-height:1;cursor:pointer;
      padding:2px 6px;user-select:none;
    }
    .empty{
      padding:56px 32px;text-align:center;color:var(--ink-faint);
      font-size:13px;font-weight:300;line-height:1.9;
    }

    /* ── 레시피 ── */
    .rwrap{padding:18px 16px 32px}
    .rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .rhead h2{font-family:'Gowun Batang',serif;font-size:22px;font-weight:700;line-height:1.35}
    .heart{
      border:none;background:none;cursor:pointer;font-size:19px;line-height:1;
      color:var(--omija);flex:none;padding:2px 0 0;
    }
    .rmeta{margin-top:9px;font-size:11.5px;color:var(--ink-soft);font-weight:300;line-height:1.85}
    .rule{height:1px;background:var(--line);margin:18px 0}
    .rlabel{font-size:10.5px;letter-spacing:.18em;color:var(--green);font-weight:600;margin-bottom:11px}
    .ings{display:flex;flex-direction:column;gap:9px}
    .ing{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
    .ing .dot{font-size:9px;line-height:1.9;flex:none}
    .ing.have .dot{color:var(--green)}
    .ing.miss .dot{color:#CBD5CC}
    .ing.miss span{color:var(--ink-soft)}
    .steps{display:flex;flex-direction:column;gap:11px}
    .step{display:flex;gap:11px;font-size:13px;line-height:1.7;font-weight:300}
    .step b{
      font-family:'Gowun Batang',serif;font-weight:700;color:var(--amber);
      font-size:12.5px;flex:none;min-width:14px;
    }
    .ytbtn{
      display:flex;align-items:center;justify-content:center;gap:9px;
      width:100%;padding:13px 0;border:1px solid var(--line);border-radius:11px;
      background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;
      font-weight:500;cursor:pointer;text-decoration:none;
    }
    .ytbtn:active{background:var(--paper)}
    .ytbtn .play{color:var(--omija);font-size:11px}

    /* ── 즐겨찾기 ── */
    .fav{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      padding:15px 18px;border-bottom:1px solid var(--line-soft);cursor:pointer;
    }
    .fav:active{background:var(--paper)}
    .fav b{font-family:'Gowun Batang',serif;font-size:16px;font-weight:700;display:block}
    .fav em{font-style:normal;font-size:11.5px;color:var(--ink-soft);font-weight:300;
      display:block;margin-top:3px}
    .fav .heart{font-size:17px;padding:0}

    /* ── 다이얼로그 ── */
    .dim{
      position:absolute;inset:0;background:rgba(27,38,32,.26);z-index:900;
      display:flex;align-items:center;justify-content:center;padding:28px;
      opacity:0;pointer-events:none;transition:opacity .18s;
    }
    .dim.show{opacity:1;pointer-events:auto}
    .dialog{
      background:var(--surface);border-radius:16px;padding:24px 20px 16px;
      width:100%;max-width:290px;text-align:center;
      box-shadow:0 18px 40px -18px rgba(27,38,32,.5);
      transform:translateY(6px);transition:transform .18s;
    }
    .dim.show .dialog{transform:none}
    .dialog p{font-size:14.5px;line-height:1.6}
    .dialog p b{font-family:'Gowun Batang',serif;font-weight:700}
    .dialog .btns{display:flex;gap:8px;margin-top:20px}
    .dialog button{
      flex:1;padding:11px 0;border-radius:9px;font-family:inherit;
      font-size:13px;font-weight:500;cursor:pointer;
    }
    .dialog .cancel{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft)}
    .dialog .ok{border:none;background:var(--omija);color:#fff}
    /* 재료 이름 제안 — 폐기가 아니므로 오미자색을 쓰지 않는다 */
    .dialog .guess{
      display:flex;flex-direction:column;gap:7px;margin-top:16px;
    }
    .dialog .guess button{
      width:100%;padding:12px 0;border:1px solid var(--line);border-radius:10px;
      background:var(--surface);font-family:'Gowun Batang',serif;font-size:15px;
      font-weight:700;color:var(--green);cursor:pointer;
    }
    .dialog .guess button:active{background:var(--green-tint)}
    .dialog .nope{
      margin-top:14px;font-size:12px;color:var(--ink-faint);
      background:none;border:none;font-family:inherit;cursor:pointer;
      text-decoration:underline;padding:4px;
    }

    /* ── 토스트 ── */
    .toast{
      position:absolute;left:50%;bottom:32px;transform:translate(-50%,10px);
      background:rgba(27,38,32,.92);color:#fff;font-size:12.5px;font-weight:400;
      padding:11px 18px;border-radius:22px;z-index:950;white-space:nowrap;
      opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
<div class="app">

  <nav class="tabs">
    <button class="on" data-tab="home">홈</button>
    <button data-tab="stock">냉장고</button>
    <button data-tab="recipe">레시피</button>
    <button data-tab="favs">즐겨찾기</button>
  </nav>

  <!-- 홈 -->
  <section class="panel on" id="home">
    <div class="sticky">
      <div class="field">
        <span class="icon">🔎</span>
        <input id="ask" type="search" enterkeyhint="search" placeholder="오늘 뭐 먹지?">
      </div>
      <div class="picker">
        <div class="row"><span class="rowname">나라</span><div class="chips" id="chipsCuisine"></div></div>
        <div class="row"><span class="rowname">자리</span><div class="chips" id="chipsSituation"></div></div>
      </div>
    </div>
    <div class="scroll">
      <div class="label"><span id="askLabel">오늘의 추천</span><span class="clear" id="askClear" hidden>초기화</span></div>
      <div class="notice" id="notice" hidden></div>
      <div class="cards" id="cards"></div>
      <div class="btnrow">
        <button class="again" id="again">⟳ 다시 추천</button>
        <button class="surprise" id="surprise">⇄ 의외의 요리</button>
      </div>
      <div class="rcount" id="rcount"></div>
    </div>
  </section>

  <!-- 냉장고 -->
  <section class="panel" id="stock">
    <div class="sticky">
      <div class="field">
        <input id="stockInput" type="text" enterkeyhint="done" placeholder="무엇이 들어 있나요?">
        <i class="add" id="stockAdd">+</i>
      </div>
    </div>
    <div class="scroll"><div class="items" id="stockList"></div></div>
  </section>

  <!-- 레시피 -->
  <section class="panel" id="recipe">
    <div class="scroll" id="recipeBody"></div>
  </section>

  <!-- 즐겨찾기 -->
  <section class="panel" id="favs">
    <div class="scroll"><div class="items" id="favList"></div></div>
  </section>

  <div class="dim" id="dim">
    <div class="dialog">
      <p><b id="dlgName"></b><span id="dlgJosa">를</span> 냉장고에서 뺄까요?</p>
      <div class="btns">
        <button class="cancel" id="dlgCancel">그대로 두기</button>
        <button class="ok" id="dlgOk">빼기</button>
      </div>
    </div>
  </div>

  <div class="dim" id="guessDim">
    <div class="dialog">
      <p><b id="guessTyped"></b><span id="guessJosa">은</span><br><span id="guessAsk"></span></p>
      <div class="guess" id="guessList"></div>
      <button class="nope" id="guessNope"></button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ─────────────────────────────────────────
   상태
───────────────────────────────────────── */
const LS = { stock:'fridge.stock', favs:'fridge.favs' };
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };

const CUISINES   = ['자유','한식','중식','일식','양식','기타'];
const SITUATIONS = ['자유','가정식','술안주','아이들요리','간식','기타'];

// 칩의 '기타' 는 저장된 태그가 아니라 "나머지 전부" 를 뜻한다.
const NAMED_CUISINE   = ['한식','중식','일식','양식'];
const NAMED_SITUATION = ['가정식','술안주','아이들요리','간식'];

let RECIPES = [];
const state = {
  cuisine: '자유',      // 나라 — 자유면 전체
  situation: '자유',    // 자리 — 자유면 전체
  stock: load(LS.stock, ['고추장','달걀','대파','두부','묵은지','애호박','양파','참기름']),
  favs:  load(LS.favs, []),
  shown: [],        // 홈에 걸린 추천 5개
  query: '',        // 현재 자연어 조건
  notice: null,     // 조건을 못 채웠을 때 띄우는 안내
  current: null,    // 레시피 탭에 열린 요리
  pending: null,    // 폐기 확인 대기 항목
  typed: null       // 사전에 없어 되물어보는 중인 입력
};

// 받침 유무에 따라 조사를 고른다 (대파를 / 묵은지를 / 달걀을)
function josa(w, withBatchim, without){
  const c = w.charCodeAt(w.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return without;
  return (c - 0xAC00) % 28 ? withBatchim : without;
}

/* ─────────────────────────────────────────
   재료 매칭

   이름이 포함되면 보유로 치던 방식은 "고추"가 "고추장"을, "기름"이
   "엿기름"을 잡고 "김치"는 "묵은지"를 놓쳤다. 이름은 계층을 뜻하지
   않는다. 그래서 ingredients.json 에 재고 항목마다 자기가 충족하는
   레시피 재료명(covers)을 적어 두고 그것만 본다.
───────────────────────────────────────── */
let DICT = [];                  // 재료 사전
let AMBIGUOUS = {};             // "치즈"처럼 하나로 못 정하는 말 → 선택지
const byName  = new Map();      // 표시명 → 항목
const byAlias = new Map();      // 별칭   → 항목
let PANTRY = new Set();         // 조미료로 분류된 레시피 재료명
let COVERED = new Set();        // 지금 재고가 충족하는 레시피 재료명

function indexDict(){
  byName.clear(); byAlias.clear(); PANTRY = new Set();
  DICT.forEach(it => {
    byName.set(it.name, it);
    (it.aliases || []).forEach(a => byAlias.set(a, it));
    if (it.pantry) it.covers.forEach(c => PANTRY.add(c));
  });
}

// 재고가 바뀔 때마다 한 번만 펼쳐 둔다 (레시피마다 사전을 뒤지지 않도록)
function recomputeCovered(){
  COVERED = new Set();
  state.stock.forEach(n => {
    const it = byName.get(n);
    if (it) it.covers.forEach(c => COVERED.add(c));
    else COVERED.add(n);        // 사전에 없는 옛 항목은 이름 그대로 둔다
  });
}

const inStock = name => COVERED.has(name);

// 조미료는 뺀다. 간장·설탕·식용유가 100개 넘는 레시피에 들어 있어서
// 점수에 넣으면 거의 모든 요리가 똑같이 가산점을 받아 의미가 없어진다.
const stockHits = r =>
  r.ingredients.filter(i => !PANTRY.has(i.name) && inStock(i.name)).length;

/* ── 입력 해석 ──────────────────────────────
   표시명·별칭에 그대로 걸리면 바로 담고, 아니면 닮은 이름을 제안한다.
   한글 오타는 글자가 아니라 자모에서 갈리므로("브로콜리"↔"브로컬리")
   자모로 풀어 놓고 견준다.
──────────────────────────────────────────── */
const CHO  = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = '␀ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ';

function jamo(s){
  let out = '';
  for (const ch of s){
    const c = ch.charCodeAt(0) - 0xAC00;
    if (c >= 0 && c < 11172){
      out += CHO[(c / 588) | 0] + JUNG[((c % 588) / 28) | 0];
      const j = c % 28;
      if (j) out += JONG[j];
    } else out += ch;
  }
  return out;
}

function editDist(a, b){
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){
    const cur = [i];
    for (let j = 1; j <= n; j++){
      cur[j] = Math.min(
        prev[j] + 1,
        cur[j - 1] + 1,
        prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
    }
    prev = cur;
  }
  return prev[n];
}

function similarity(a, b){
  const x = jamo(a), y = jamo(b);
  if (!x.length || !y.length) return 0;
  return 1 - editDist(x, y) / Math.max(x.length, y.length);
}

// 용량·개수는 무시한다 ("돼지고기 300g" → "돼지고기")
const tidy = s => s
  .replace(/\([^)]*\)/g, '')
  .replace(/[\d.]+\s*(g|kg|ml|l|리터|개|봉|팩|알|장|근|마리|인분|컵|큰술|작은술)?/gi, '')
  .replace(/\s+/g, '')
  .trim();

// 갈림말이면 선택지를, 아니면 빈 배열
function ambiguousPicks(raw){
  const q = tidy(raw);
  return AMBIGUOUS[q] || AMBIGUOUS[raw.trim()] || [];
}

// 그대로 알아들으면 항목을, 아니면 null. 갈림말은 되물어야 하므로 null.
function resolve(raw){
  const q = tidy(raw);
  if (!q || ambiguousPicks(raw).length) return null;
  return byName.get(q) || byAlias.get(q) ||
         byName.get(raw.trim()) || byAlias.get(raw.trim()) || null;
}

// 낱자만 두드린 입력("ㅁㄴㅇㄹ")은 자모로 풀면 짧은 재료와 우연히 닮는다.
// 온전한 글자가 하나도 없으면 재료로 보지 않는다.
const onlyJamo = s => /^[ㄱ-ㅣ]+$/.test(s);

// 닮은 이름 최대 3개. 표시명으로 돌려준다
function suggest(raw, n = 3){
  const q = tidy(raw);
  if (!q || onlyJamo(q)) return [];
  const best = new Map();               // 표시명 → 가장 높은 점수
  const put = (name, s) => {
    if (s > (best.get(name) ?? 0)) best.set(name, s);
  };
  DICT.forEach(it => {
    put(it.name, similarity(q, it.name));
    (it.aliases || []).forEach(a => put(it.name, similarity(q, a)));
  });
  // 오타는 진짜 짝이 0.85 언저리, 엉뚱한 것은 0.67 아래로 갈린다.
  // 그래서 절대 점수만 보지 않고 1등에 가까운 것만 남긴다 —
  // "브로컬리"에 블루베리까지 같이 보여 주면 오히려 헷갈린다.
  const ranked = [...best.entries()]
    .filter(([, s]) => s >= 0.62)
    .sort((a, b) => b[1] - a[1]);
  if (!ranked.length) return [];
  const cut = ranked[0][1] - 0.15;
  return ranked.filter(([, s]) => s >= cut).slice(0, n).map(([name]) => name);
}

/* ─────────────────────────────────────────
   자연어 해석
───────────────────────────────────────── */
const VOCAB = {
  flavor: {
    '매콤':['매콤','매운','맵','칼칼','알싸'], '얼큰':['얼큰','시원한 국물','해장'],
    '담백':['담백','슴슴','순한','건강','가벼운','다이어트'], '고소':['고소','크리미'],
    '새콤':['새콤','상큼','새콤달콤'], '달콤':['달콤','달달','단맛'], '짭짤':['짭짤','짭조름']
  },
  type: {
    '국찌개':['국','찌개','탕','스프','수프'], '볶음':['볶음','볶은'], '무침':['무침','나물'],
    '조림':['조림','졸임'], '구이':['구이','구운','스테이크'], '튀김':['튀김','튀긴','전'],
    '면':['면','국수','파스타','라면'], '샐러드':['샐러드'], '밥':['밥','덮밥','볶음밥'],
    '빵디저트':['빵','디저트','케이크','샌드위치','팬케이크'], '음료':['음료','주스','스무디','에이드']
  },
  cuisine: {
    '한식':['한식','한국'], '양식':['양식','서양','이탈리'], '중식':['중식','중국','중화'],
    '일식':['일식','일본'], '베트남식':['베트남'], '태국식':['태국','타이']
  },
  situation: {
    '가정식':['가정식','집밥','밥반찬','반찬','밥상'], '술안주':['안주','술'],
    '아이들요리':['아이','애들','유아','어린이'], '간식':['간식','후식','디저트']
  }
};

const QUICK = ['간편','간단','빠른','후딱','금방','쉬운'];

// 코퍼스에 등장하는 주재료 목록 (긴 이름 우선 매칭)
let MAIN_INDEX = [];

function parseQuery(q){
  const want = { main:[], flavor:[], type:null, cuisine:null, situation:[], maxTime:null };
  if (!q) return want;

  MAIN_INDEX.forEach(m => { if (q.includes(m)) want.main.push(m) });

  // 사전의 별칭으로 적어도 알아듣는다 ("계란 요리" → 달걀)
  DICT.forEach(it => {
    if (!MAIN_INDEX.includes(it.name) || want.main.includes(it.name)) return;
    if ((it.aliases || []).some(a => a.length >= 2 && q.includes(a)))
      want.main.push(it.name);
  });

  // 1글자 키워드는 다른 낱말 속에 우연히 끼어 오탐을 내므로 뺀다
  // ('국'이 '중국요리'에, '파'가 '파스타'에 걸리는 것을 막기 위함)
  const hit = w => w.length >= 2 && q.includes(w);

  for (const [tag, words] of Object.entries(VOCAB.flavor))
    if (words.some(hit)) want.flavor.push(tag);
  for (const [tag, words] of Object.entries(VOCAB.situation))
    if (words.some(hit)) want.situation.push(tag);
  for (const [tag, words] of Object.entries(VOCAB.type))
    if (!want.type && words.some(hit)) want.type = tag;
  for (const [tag, words] of Object.entries(VOCAB.cuisine))
    if (!want.cuisine && words.some(hit)) want.cuisine = tag;

  const m = q.match(/(\d+)\s*분/);
  if (m) want.maxTime = +m[1];
  else if (QUICK.some(w => q.includes(w))) want.maxTime = 15;

  return want;
}

function score(r, want, stockSign = 1){
  let s = 0;
  want.main.forEach(m => {
    if (r.main.includes(m)) s += 10;
    else if (r.ingredients.some(i => i.name.includes(m))) s += 5;
  });
  want.flavor.forEach(f => { if (r.flavor.includes(f)) s += 6 });
  want.situation.forEach(x => { if (r.situation.includes(x)) s += 5 });
  if (want.type && r.type === want.type) s += 5;
  if (want.cuisine && r.cuisine === want.cuisine) s += 5;
  if (want.maxTime && r.time <= want.maxTime) s += 4;
  s += stockHits(r) * 1.2 * stockSign;   // 재고는 제약이 아니라 가산점(역추천일 땐 감점)
  return s;
}

function matchCuisine(r){
  if (state.cuisine === '자유') return true;
  if (state.cuisine === '기타') return !NAMED_CUISINE.includes(r.cuisine);
  return r.cuisine === state.cuisine;
}
function matchSituation(r){
  if (state.situation === '자유') return true;
  if (state.situation === '기타') return !r.situation.some(x => NAMED_SITUATION.includes(x));
  return r.situation.includes(state.situation);
}
const matchChips = r => matchCuisine(r) && matchSituation(r);

// 자연어에서 건진 조건이 하나라도 있는가
const understood = w =>
  w.main.length || w.flavor.length || w.type || w.cuisine || w.situation.length || w.maxTime;

// 재고 가산점을 뺀 순수 요청 부합도 — 0이면 요청과 무관한 요리다
const fitScore = (r, want) => score(r, want) - stockHits(r) * 1.2;

// 추천은 절대 비지 않는다.
// 조건을 한 단계씩 풀어가며 5개를 채우고, 1단계로 못 채웠으면 안내를 남긴다.
function pick(n = 5, invert = false){
  const want = parseQuery(state.query);
  const asked = !!state.query;
  const got   = understood(want);
  const fits  = r => !got || fitScore(r, want) > 0;

  // 위에서부터 조건이 느슨해진다
  const tiers = [
    r => matchChips(r) && fits(r),                              // 칩 + 자연어
    r => matchChips(r),                                         // 칩만
    r => (matchCuisine(r) || matchSituation(r)) && fits(r),     // 칩 한쪽 + 자연어
    r => matchCuisine(r) || matchSituation(r),                  // 칩 한쪽
    r => fits(r),                                               // 자연어만
    () => true                                                  // 전부
  ];

  // 의외의 요리(invert): 조건은 그대로 두되, 재고 매칭이 많을수록 오히려 감점해
  // 평소 재고 가산점에 밀려 안 보이던 요리를 끌어올린다.
  const rank = list => list
    .map(r => ({ r, s: score(r, want, invert ? -1 : 1) + Math.random() * (asked && got ? 0.8 : 2.6) }))
    .sort((a,b) => b.s - a.s)
    .map(x => x.r);

  const out = [];
  let firstTierFilled = false;
  tiers.forEach((pass, i) => {
    if (out.length >= n) return;
    const add = rank(RECIPES.filter(r => pass(r) && !out.includes(r)));
    if (i === 0 && add.length >= n) firstTierFilled = true;
    out.push(...add.slice(0, n - out.length));
  });

  // 못 알아들은 요청은 1단계가 다 차더라도 알려준다 (전부 통과시킨 것뿐이므로)
  state.notice =
      asked && !got   ? '무슨 요리인지 몰라서 비슷한 걸로 골라봤어요'
    : firstTierFilled ? null
    :                   '딱 맞는 요리가 없어 비슷한 걸로 채웠어요';

  return out.slice(0, n);
}

const $ = id => document.getElementById(id);

function tab(name){
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === name));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.scroll').forEach(s => s.scrollTop = 0);
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function renderChips(){
  const build = (el, list, key) => {
    el.innerHTML = list.map(v =>
      `<span class="chip${state[key] === v ? ' on' : ''}" data-key="${key}" data-v="${v}">${v}</span>`
    ).join('');
    // 고른 칩이 줄 밖으로 밀려 잘리지 않게 가로 스크롤을 맞춘다
    const on = el.querySelector('.chip.on');
    if (!on) return;
    const left = on.offsetLeft, right = left + on.offsetWidth;
    if (left < el.scrollLeft) el.scrollLeft = Math.max(0, left - 8);
    else if (right > el.scrollLeft + el.clientWidth) el.scrollLeft = right - el.clientWidth + 8;
  };
  build($('chipsCuisine'), CUISINES, 'cuisine');
  build($('chipsSituation'), SITUATIONS, 'situation');
}

function renderCards(){
  const picked = [
    state.cuisine   !== '자유' ? state.cuisine   : null,
    state.situation !== '자유' ? state.situation : null
  ].filter(Boolean);
  const parts = [];
  if (picked.length) parts.push(picked.join(' · '));
  if (state.query) parts.push(`"${state.query}"`);
  $('askLabel').textContent = parts.length ? parts.join(' ') + ' 추천' : '오늘의 추천';
  $('askClear').hidden = !parts.length;
  $('notice').hidden = !state.notice;
  if (state.notice) $('notice').textContent = state.notice;
  $('cards').innerHTML = state.shown.map(r => `
    <div class="card" data-id="${r.id}">
      <h3>${r.name}</h3>
      <div class="meta"><span>${r.time}분</span><span>${r.calories}kcal</span></div>
      <span class="tag">${r.cuisine}</span>
    </div>`).join('');
}

function renderStock(){
  const list = $('stockList');
  if (!state.stock.length){
    list.innerHTML = `<div class="empty">냉장고가 텅 비었어요.<br>위에 재료를 적어 채워 주세요.</div>`;
    return;
  }
  list.innerHTML = state.stock.map(n => `
    <div class="item"><span>${n}</span><span class="del" data-name="${n}">×</span></div>
  `).join('');
}

function renderRecipe(){
  const r = state.current;
  const body = $('recipeBody');
  if (!r){
    body.innerHTML = `<div class="empty">아직 고른 요리가 없어요.<br>홈에서 마음에 드는 카드를 눌러 주세요.</div>`;
    return;
  }
  const liked = state.favs.some(f => f.id === r.id);
  const yt = `https://www.youtube.com/results?search_query=${encodeURIComponent(r.name + ' 레시피')}`;
  const n = r.nutrition;

  body.innerHTML = `
    <div class="rwrap">
      <div class="rhead">
        <h2>${r.name}</h2>
        <button class="heart" id="like">${liked ? '♥' : '♡'}</button>
      </div>
      <div class="rmeta">
        ${r.time}분 · ${r.servings}인분 · ${r.calories}kcal<br>
        탄수 ${n.carb}g / 단백 ${n.protein}g / 지방 ${n.fat}g
      </div>

      <div class="rule"></div>
      <div class="rlabel">재료</div>
      <div class="ings">
        ${r.ingredients.map(i => {
          const has = inStock(i.name);
          return `<div class="ing ${has ? 'have' : 'miss'}">
            <span class="dot">${has ? '●' : '○'}</span><span>${i.name} ${i.amount}</span>
          </div>`;
        }).join('')}
      </div>

      <div class="rule"></div>
      <div class="rlabel">조리 순서</div>
      <div class="steps">
        ${r.steps.map((s, i) => `<div class="step"><b>${i + 1}</b><span>${s}</span></div>`).join('')}
      </div>

      <div class="rule"></div>
      <div class="rlabel">참고 영상</div>
      <a class="ytbtn" href="${yt}" target="_blank" rel="noopener">
        <span class="play">▶</span><span>유튜브에서 "${r.name}" 영상 보기</span>
      </a>
    </div>`;

  $('like').onclick = toggleFav;
}

function renderFavs(){
  const list = $('favList');
  if (!state.favs.length){
    list.innerHTML = `<div class="empty">아직 담아둔 레시피가 없어요.<br>레시피 화면에서 ♡ 를 눌러 보세요.</div>`;
    return;
  }
  list.innerHTML = [...state.favs].reverse().map(r => `
    <div class="fav" data-id="${r.id}">
      <span><b>${r.name}</b><em>${r.time}분 · ${r.calories}kcal</em></span>
      <button class="heart" data-un="${r.id}">♥</button>
    </div>`).join('');
}

function openRecipe(id){
  // 즐겨찾기에 저장된 사본이 있으면 그것을, 없으면 원본을 연다.
  state.current = state.favs.find(f => f.id === id) || RECIPES.find(r => r.id === id);
  renderRecipe();     // ●/○ 는 매번 현재 재고로 다시 판정된다
  tab('recipe');
}

function toggleFav(){
  const r = state.current;
  if (!r) return;
  const i = state.favs.findIndex(f => f.id === r.id);
  if (i >= 0) state.favs.splice(i, 1);
  else state.favs.push(JSON.parse(JSON.stringify(r)));   // 레시피 내용을 통째로 저장
  save(LS.favs, state.favs);
  renderRecipe();
  renderFavs();
}

// 실제로 목록에 넣는 부분. 이름은 이미 정해진 상태로 들어온다.
function putStock(name){
  if (state.stock.includes(name)){
    toast('이미 등록된 재료입니다');
    return;
  }
  state.stock.push(name);
  state.stock.sort((a, b) => a.localeCompare(b, 'ko'));
  save(LS.stock, state.stock);
  recomputeCovered();
  renderStock();
  if (state.current) renderRecipe();
}

function closeGuess(){
  $('guessDim').classList.remove('show');
  state.typed = null;
}

// 사전에 있으면 바로 담고, 닮은 이름이 있으면 물어보고, 둘 다 아니면
// 적은 그대로 담는다. 어느 쪽이든 입력창은 비운다.
function addStock(){
  const input = $('stockInput');
  const raw = input.value.trim();
  if (!raw) return;
  input.value = '';

  const hit = resolve(raw);
  if (hit){
    if (hit.name !== raw) toast(`${hit.name}${josa(hit.name, '으로', '로')} 담았어요`);
    putStock(hit.name);
    return;
  }

  // "치즈"처럼 여러 개를 가리키는 말은 모른다고 하지 않고 고르게 한다
  const picks = ambiguousPicks(raw);
  const guesses = picks.length ? picks : suggest(raw);
  if (!guesses.length){
    putStock(raw);
    return;
  }

  // 갈림말을 그대로 담으면 어느 레시피와도 안 맞는 항목이 남는다.
  // 그래서 이때는 "그대로 담기" 대신 그냥 물러나게 한다.
  state.typed = picks.length ? null : raw;
  $('guessTyped').textContent = raw;
  $('guessJosa').textContent = josa(raw, '은', '는');
  $('guessAsk').textContent = picks.length
    ? '어느 쪽인가요?'
    : '아직 모르는 재료예요. 혹시 이건가요?';
  $('guessNope').textContent = picks.length
    ? '나중에 고를게요'
    : '아니에요, 적은 그대로 담기';
  $('guessList').innerHTML = guesses
    .map(g => `<button data-pick="${g}">${g}</button>`).join('');
  $('guessDim').classList.add('show');
}

};

$('guessList').onclick = e => {
  const b = e.target.closest('[data-pick]');
  if (!b) return;
  const name = b.dataset.pick;
  closeGuess();
  putStock(name);
};
$('guessNope').onclick = () => {
  const raw = state.typed;
  closeGuess();
  if (raw) putStock(raw);
};
$('guessDim').onclick = e => { if (e.target === $('guessDim')) closeGuess() };

$('favList').onclick = e => {
  const un = e.target.closest('[data-un]');
  if (un){
    state.favs = state.favs.filter(f => f.id !== un.dataset.un);
    save(LS.favs, state.favs);
    renderFavs();
    if (state.current) renderRecipe();
    return;
  }
  const f = e.target.closest('.fav');
  if (f) openRecipe(f.dataset.id);
};

/* ─────────────────────────────────────────
   기동
───────────────────────────────────────── */
// 예전에 자유롭게 적어 둔 재고를 사전의 표시명으로 옮긴다.
// 알아듣지 못하는 것은 지우지 않고 그대로 둔다.
function migrateStock(){
  const out = [];
  state.stock.forEach(n => {
    const hit = resolve(n);
    const name = hit ? hit.name : n;
    if (!out.includes(name)) out.push(name);
  });
  const changed = out.length !== state.stock.length ||
                  out.some((n, i) => n !== state.stock[i]);
  if (changed){
    state.stock = out.sort((a, b) => a.localeCompare(b, 'ko'));
    save(LS.stock, state.stock);
  }
}

function boot(data, dict){
  RECIPES = data;
  DICT      = (dict && dict.items) || [];
  AMBIGUOUS = (dict && dict.ambiguous) || {};
  indexDict();
  migrateStock();
  recomputeCovered();
  MAIN_INDEX = [...new Set(RECIPES.flatMap(r => r.main))]
    .filter(m => m.length >= 2)          // 1글자 재료는 오탐이 많아 자연어 매칭에서 제외
    .sort((a, b) => b.length - a.length);
  $('rcount').textContent = `레시피 ${RECIPES.length}개`;
  renderChips();
  state.shown = pick();
  renderCards();
  renderStock();
  renderRecipe();
  renderFavs();
}

// 단일 파일 미리보기에서는 RECIPES_INLINE 이 먼저 주입된다.
if (typeof RECIPES_INLINE !== 'undefined')
  boot(RECIPES_INLINE, typeof INGREDIENTS_INLINE !== 'undefined' ? INGREDIENTS_INLINE : null);
else
  Promise.all([
    fetch('recipes.json').then(r => r.json()),
    // 사전을 못 받아도 레시피만으로 돌아간다 (재고 매칭만 이름 그대로가 된다)
    fetch('ingredients.json').then(r => r.json()).catch(() => null)
  ]).then(([recipes, dict]) => boot(recipes, dict)).catch(() => {
    $('cards').innerHTML = `<div class="empty">레시피를 불러오지 못했습니다.</div>`;
  });

// 홈 화면에 설치된 뒤에도 새 내용을 받아 오도록 등록해 둔다
if ('serviceWorker' in navigator)
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
