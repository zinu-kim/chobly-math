<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>초연이의 수학문제</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B6CB0">
<link rel="stylesheet" href="../shared/style.css">
<style>
  :root { --accent: #2B6CB0; --accent-strong: #1F4F82; --accent-soft: #E6F0F9; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --accent: #7FB6EF; --accent-strong: #A5CDF6; --accent-soft: #16273B; }
  }
  .pane { display: none; }
  .pane.on { display: block; }
  .counter { font-size: 13px; font-weight: 700; color: var(--accent-strong); letter-spacing: 0.02em; }
  .verdict { border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 600; margin-top: 4px; }
  .verdict.good { background: var(--accent-soft); color: var(--accent-strong); }
  .verdict.retry { background: var(--amber-soft); color: var(--amber); }
  .verdict.show { background: var(--red-soft); color: var(--red); }
  .solution { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line);
              font-size: 14px; line-height: 1.85; color: var(--ink); }
  .mark { font-size: 20px; font-weight: 700; flex: none; width: 26px; text-align: center; }
  .mark.o { color: var(--accent); }
  .mark.x { color: var(--red); }
  .score { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
</style>
</head>
<body>

<div class="top"><div class="top-inner">
  <h1>초연이의 수학문제</h1>
  <p id="topsub">아빠가 보내준 문제 풀기</p>
</div></div>

<div class="wrap">

  <!-- ① 홈 -->
  <section class="pane on" id="p1">
    <div class="card">
      <h2 class="title">안녕 초연아 👋</h2>
      <p class="sub">아빠가 보내준 코드를 붙여넣으면 문제가 나와요.</p>
      <div class="btns">
        <button class="primary" id="toLoad">새 문제 불러오기</button>
      </div>
    </div>

    <div class="card">
      <h2 class="title" style="font-size:15px">최근 문제</h2>
      <div id="hist" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- ② 불러오기 -->
  <section class="pane" id="p2">
    <div class="card">
      <h2 class="title">문제 불러오기</h2>
      <p class="sub">아빠가 카톡으로 보낸 코드를 전체 복사해서 붙여넣으세요.</p>
      <label class="field" for="code">문제 코드</label>
      <textarea id="code" placeholder="CHOBLY-1: 로 시작하는 코드를 붙여넣으세요"></textarea>
      <div id="loadErr"></div>
      <div class="btns">
        <button class="primary" id="doLoad" disabled>문제 가져오기</button>
        <button class="plain" id="backHome">돌아가기</button>
      </div>
    </div>
  </section>

  <!-- ③ 문제 풀기 -->
  <section class="pane" id="p3">
    <div class="steps" id="dots"></div>

    <div class="card">
      <div class="counter" id="counter"></div>
      <div class="qtext" id="q" style="margin-top:8px"></div>

      <div id="answerArea"></div>

      <div id="verdict"></div>
      <div id="solution"></div>
    </div>

    <div class="btns">
      <button class="primary" id="check">확인</button>
      <button class="primary hide" id="next">다음 문제</button>
      <button class="plain" id="quit">그만 풀기</button>
    </div>
  </section>

  <!-- ④ 결과 -->
  <section class="pane" id="p4">
    <div class="card center">
      <p class="sub" style="margin-bottom:6px">다 풀었어요!</p>
      <div class="score" id="score"></div>
      <p class="muted" id="scoreMsg" style="margin-top:6px"></p>
    </div>

    <div class="card">
      <h2 class="title" style="font-size:15px">푼 문제</h2>
      <div id="review" style="margin-top:10px"></div>
    </div>

    <div class="btns">
      <button class="primary hide" id="retryWrong">틀린 문제만 다시 풀기</button>
      <button class="ghost" id="retryAll">처음부터 다시 풀기</button>
      <button class="plain" id="toHome">홈으로</button>
    </div>
  </section>
</div>

<script src="../shared/mathfmt.js"></script>
<script src="../shared/validator.js"></script>
<script src="../shared/storage.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

const $ = id => document.getElementById(id);
const MAX_TRY = 2;   // 첫 시도 + 다시 풀 기회 1번 (SPEC 3절)

const run = { setId: null, problems: [], queue: [], pos: 0, tries: 0, results: {} };

function show(n) {
  for (let i = 1; i <= 4; i++) $('p' + i).classList.toggle('on', i === n);
  window.scrollTo(0, 0);
}

/* ---------- ① 홈 ---------- */
function renderHistory() {
  const sets = Storage.getKidSets();
  const box = $('hist');
  if (!sets.length) { box.innerHTML = '<p class="muted">아직 받은 문제가 없어요.</p>'; return; }

  box.innerHTML = '';
  sets.forEach(s => {
    const total = s.problems.length;
    const right = s.problems.filter((_, i) => s.results[i] === 'correct').length;
    const solved = Object.keys(s.results).length;
    const d = new Date(s.createdAt);
    const when = (d.getMonth() + 1) + '월 ' + d.getDate() + '일';

    const row = document.createElement('div');
    row.className = 'row';
    row.style.cursor = 'pointer';
    row.innerHTML =
      '<div class="grow">' +
        '<div style="font-size:14px;font-weight:600">' + total + '문제</div>' +
        '<div class="meta">' + when + ' · ' +
          (solved ? (right + '/' + total + ' 맞음') : '아직 안 풀었어요') +
        '</div>' +
      '</div>' +
      (s.isNew ? '<span class="tag">NEW</span>' : '');

    row.addEventListener('click', () => {
      Storage.markRead(Storage.KID_KEY, s.id);
      startSet(s.id, null);
    });
    box.appendChild(row);
  });
}

$('toLoad').addEventListener('click', () => {
  $('code').value = '';
  $('loadErr').innerHTML = '';
  $('doLoad').disabled = true;
  show(2);
});

/* ---------- ② 불러오기 ---------- */
$('code').addEventListener('input', () => {
  $('doLoad').disabled = !$('code').value.trim();
  $('loadErr').innerHTML = '';
});

$('backHome').addEventListener('click', () => { renderHistory(); show(1); });

$('doLoad').addEventListener('click', () => {
  const problems = Storage.decodeShareData($('code').value);
  if (!problems) {
    $('loadErr').innerHTML =
      '<div class="note bad" style="margin:12px 0 0">코드를 읽지 못했어요. ' +
      '아빠가 보낸 코드를 처음부터 끝까지 전부 복사했는지 확인해 주세요.</div>';
    return;
  }
  const id = Storage.saveKidSet(problems);
  Storage.markRead(Storage.KID_KEY, id);
  startSet(id, null);
});

/* ---------- ③ 문제 풀기 ---------- */
function startSet(setId, onlyIndexes) {
  const set = Storage.getKidSet(setId);
  if (!set) { renderHistory(); show(1); return; }

  run.setId = setId;
  run.problems = set.problems;
  run.results = Object.assign({}, set.results);
  run.queue = onlyIndexes && onlyIndexes.length
    ? onlyIndexes.slice()
    : set.problems.map((_, i) => i);
  run.pos = 0;

  if (!onlyIndexes) run.results = {};
  show(3);
  renderQuestion();
}

function renderQuestion() {
  if (run.pos >= run.queue.length) { finish(); return; }

  const idx = run.queue[run.pos];
  const p = run.problems[idx];
  run.tries = 0;

  // 진행 점
  $('dots').innerHTML = run.queue.map((_, i) =>
    '<i class="' + (i < run.pos ? 'done' : (i === run.pos ? 'on' : '')) + '"></i>').join('');

  $('counter').textContent = (run.pos + 1) + ' / ' + run.queue.length + '번 문제';
  $('q').innerHTML = MathFmt.renderText(p.question);
  $('answerArea').innerHTML = MathFmt.buildInput(p.type, p.unit);
  $('verdict').innerHTML = '';
  $('solution').innerHTML = '';

  $('check').classList.remove('hide');
  $('check').disabled = false;
  $('next').classList.add('hide');
  MathFmt.focusFirst($('answerArea'));
}

$('check').addEventListener('click', () => {
  const idx = run.queue[run.pos];
  const p = run.problems[idx];
  const given = MathFmt.readInput($('answerArea'), p.type);

  if (Validator.isBlank(given)) {
    $('verdict').innerHTML = '<div class="verdict retry">답을 먼저 써 주세요.</div>';
    return;
  }

  run.tries++;
  const ok = Validator.checkAnswer(given, p.answer);

  if (ok) {
    $('verdict').innerHTML = '<div class="verdict good">잘했어요! 정답이에요 🎉</div>';
    record(idx, 'correct');
    toNext();
    return;
  }

  if (run.tries < MAX_TRY) {
    // 다시 풀 기회 1번 (SPEC 3절)
    $('verdict').innerHTML =
      '<div class="verdict retry">아쉬워요. 한 번 더 풀어볼까요?</div>';
    MathFmt.clearInput($('answerArea'));
    MathFmt.focusFirst($('answerArea'));
    return;
  }

  // 두 번 틀리면 정답과 풀이를 보여준다 (SPEC 3절)
  $('verdict').innerHTML =
    '<div class="verdict show">정답은 ' + MathFmt.renderAnswer(p.answer, p.unit) + ' 이에요.</div>';
  $('solution').innerHTML = p.explanation
    ? '<div class="solution"><b>풀이</b><br>' + MathFmt.renderText(p.explanation) + '</div>'
    : '<div class="solution muted">이 문제는 풀이가 없어요.</div>';
  record(idx, 'wrong');
  toNext();
});

function record(idx, result) {
  run.results[idx] = result;
  Storage.saveKidResult(run.setId, idx, result);
}

function toNext() {
  $('check').classList.add('hide');
  $('next').classList.remove('hide');
  $('next').textContent = (run.pos + 1 >= run.queue.length) ? '결과 보기' : '다음 문제';
}

$('next').addEventListener('click', () => { run.pos++; renderQuestion(); });
$('quit').addEventListener('click', () => { renderHistory(); show(1); });

/* ---------- ④ 결과 ---------- */
function finish() {
  const total = run.queue.length;
  const right = run.queue.filter(i => run.results[i] === 'correct').length;

  $('score').textContent = right + ' / ' + total;
  $('scoreMsg').textContent =
    right === total ? '전부 맞았어요! 대단해요 🎉'
    : right === 0   ? '괜찮아요. 풀이를 보고 다시 해봐요.'
                    : '틀린 문제를 다시 풀어볼까요?';

  const box = $('review');
  box.innerHTML = '';
  run.queue.forEach((idx, i) => {
    const p = run.problems[idx];
    const ok = run.results[idx] === 'correct';
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<div class="mark ' + (ok ? 'o' : 'x') + '">' + (ok ? 'O' : 'X') + '</div>' +
      '<div class="grow">' +
        '<div style="font-size:13.5px;line-height:1.6">' +
          MathFmt.renderText(p.question.length > 46 ? p.question.slice(0, 46) + '…' : p.question) +
        '</div>' +
        '<div class="meta">정답 ' + MathFmt.renderAnswer(p.answer, p.unit) + '</div>' +
      '</div>';
    box.appendChild(row);
  });

  const wrong = run.queue.filter(i => run.results[i] !== 'correct');
  $('retryWrong').classList.toggle('hide', wrong.length === 0);
  $('retryWrong').textContent = '틀린 ' + wrong.length + '문제만 다시 풀기';

  show(4);
}

$('retryWrong').addEventListener('click', () => {
  const wrong = run.queue.filter(i => run.results[i] !== 'correct');
  startSet(run.setId, wrong);
});
$('retryAll').addEventListener('click', () => startSet(run.setId, null));
$('toHome').addEventListener('click', () => { renderHistory(); show(1); });

renderHistory();
</script>
</body>
</html>
