<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f2724b">
<title>초블리 문제 생성기</title>
<style>
  :root{
    --ink:#1b2430; --sub:#6b7684; --line:#e3e7ec; --bg:#f6f7f9;
    --card:#fff; --kid:#f2724b; --ok:#17a06a; --new:#7c4dff; --soft:#f7f9fc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior:none;
  }
  .bar{
    padding:13px 15px;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:9px;flex:0 0 auto;
  }
  .bar .back,.bar .gear{border:0;background:transparent;font-size:19px;color:var(--sub);padding:0 3px;cursor:pointer;font-family:inherit}
  .bar .t{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .gear{margin-left:auto;font-size:16px}
  .wrap{flex:1;overflow-y:auto;padding:15px;-webkit-overflow-scrolling:touch;max-width:520px;width:100%;margin:0 auto}

  .btn{
    display:block;width:100%;border:0;border-radius:13px;padding:15px;
    font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:9px;
  }
  .btn:active{transform:scale(.985)}
  .btn.kid{background:var(--kid);color:#fff}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.ok{background:var(--ok);color:#fff}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.sm{padding:10px;font-size:13px;margin-top:0}
  .row{display:flex;gap:8px}
  .row .btn{margin-top:9px}

  .label{font-size:11.5px;color:var(--sub);margin:18px 0 7px;letter-spacing:.03em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;line-height:1.8}
  .card .n{font-weight:700;font-size:14.5px}
  .card .m{color:var(--sub);font-size:12px;margin-top:3px}

  input[type=text],input[type=number],input[type=password],select,textarea.plain{
    width:100%;border:1.5px solid #c8d1dc;border-radius:10px;padding:10px 12px;
    font-size:14px;font-family:inherit;color:var(--ink);background:#fff;
  }
  input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,select:focus,textarea.plain:focus{outline:0;border-color:var(--kid)}
  textarea.plain{resize:vertical;line-height:1.6}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  .fieldrow{display:flex;gap:8px;margin-top:8px}
  .field{flex:1;min-width:0}
  .field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:4px}

  .note{border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-top:11px}
  .note.warn{background:#fff5e8;color:#8a5a12}
  .note.good{background:#eaf7f0;color:#0f6d49}
  .note.info{background:#f1eeff;color:#4a2fb0}
  .note.bad{background:#fdeced;color:#a52334}

  .prog{height:6px;border-radius:4px;background:#e9ecf0;overflow:hidden;margin-bottom:10px}
  .prog i{display:block;height:100%;background:var(--kid);transition:width .3s}

  .badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;margin-left:6px;vertical-align:2px}
  .badge.ok{background:#eaf7f0;color:#0f6d49}
  .badge.bad{background:#fdeced;color:#a52334}
  #cCheck.badge{display:block;padding:8px 10px;border-radius:8px;font-size:12px;margin-left:0}
  #cCheck.badge:empty{padding:0}

  .imgprev{max-width:100%;border-radius:12px;border:1px solid var(--line);margin-top:8px;display:block}
  .imgrow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .imgrow .rm{color:var(--sub);font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:20px;background:#fff;cursor:pointer}

  .excl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);margin-top:9px}
  .itemcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;line-height:1.8}

  /* 세로 분수 */
  .fr{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
      vertical-align:middle;margin:0 3px;line-height:1;position:relative;top:-.08em}
  .fr .up,.fr .dn{font-size:.74em;font-weight:700;line-height:1.15}
  .fr .ln{width:100%;min-width:12px;height:1.4px;background:currentColor;margin:2px 0}

  .steps{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:11px;font-size:13.5px;line-height:2.1}
  .steps .st{margin-bottom:12px}
  .steps .st:last-child{margin-bottom:0}
  .steps .sh{font-weight:700;font-size:13px;color:var(--kid);margin-bottom:3px}
  .steps .sd{color:#3c4653;font-size:13px;line-height:1.9}
  .steps .sf{background:#fff;border-radius:8px;padding:9px 11px;margin-top:6px;font-size:14px;line-height:2;font-weight:600}
  .steps .fin{border-top:1px dashed var(--line);padding-top:11px;font-weight:700;font-size:14px;line-height:2}

  textarea#codeBox{
    width:100%;min-height:160px;border:1.5px dashed #c3ccd8;border-radius:12px;
    padding:12px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    background:#fff;line-height:1.6;word-break:break-all;color:var(--ink);
  }
  .hide{display:none!important}
</style>
</head>
<body>

<div class="bar">
  <button class="back hide" id="backBtn">←</button>
  <span class="t" id="title">초블리 문제 생성기</span>
  <button class="gear hide" id="gearBtn">⚙️</button>
</div>
<div class="wrap" id="wrap"></div>

<script>
"use strict";

/* =========================================================
   0. 기본 유틸 (index.html과 동일한 표기 규칙)
   ========================================================= */
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function fracHTML(text){
  var s = esc(String(text == null ? "" : text));
  return s.replace(/(\d+)_(\d+)\/(\d+)|(\d+)\/(\d+)/g, function(m, mw, mn, md, fn, fd){
    if(mw !== undefined){
      return mw + '<span class="fr"><span class="up">'+mn+'</span><i class="ln"></i><span class="dn">'+md+'</span></span>';
    }
    return '<span class="fr"><span class="up">'+fn+'</span><i class="ln"></i><span class="dn">'+fd+'</span></span>';
  });
}
function typeLabel(t){
  return {int:"정수", dec:"소수", frac:"분수", mixed:"대분수"}[t] || t;
}
function answerTextFlat(a){
  if(a.type === "int" || a.type === "dec") return String(a.value);
  if(a.type === "frac") return a.num + "/" + a.den;
  if(a.type === "mixed") return a.whole + "_" + a.num + "/" + a.den;
  return "";
}
function shortText(t){
  t = String(t||"");
  return t.length > 46 ? t.slice(0,46) + "…" : t;
}

/* =========================================================
   1. 정확한 분수(유리수) 연산 — 계산 검증의 핵심
   BigInt로 계산해서 부동소수점 오차가 전혀 없다.
   ========================================================= */
function bgcd(a,b){ if(a<0n) a=-a; if(b<0n) b=-b; while(b){ var t=b; b=a%b; a=t; } return a; }
function pow10(n){ var r=1n; for(var i=0;i<n;i++) r*=10n; return r; }
function makeFrac(n,d){
  if(d === 0n) throw new Error("0으로 나눌 수 없습니다.");
  if(d < 0n){ n=-n; d=-d; }
  var g = bgcd(n,d);
  if(g > 1n){ n/=g; d/=g; }
  return {n:n, d:d};
}
function fracFromInt(i){ return makeFrac(i, 1n); }
function fracFromDecimalString(numStr){
  var parts = String(numStr).split(".");
  var intPart = parts[0] || "0", fracPart = parts[1] || "";
  var den = pow10(fracPart.length);
  var num = BigInt((intPart || "0") + fracPart);
  return makeFrac(num, den);
}
function fracFromDecimal(x){
  var neg = x < 0, ax = Math.abs(x);
  var s = ax.toString();
  if(s.indexOf("e") !== -1 || s.indexOf("E") !== -1){
    s = ax.toFixed(6).replace(/0+$/,"").replace(/\.$/,"");
  }
  var f = fracFromDecimalString(s);
  return neg ? makeFrac(-f.n, f.d) : f;
}
function fracAdd(a,b){ return makeFrac(a.n*b.d + b.n*a.d, a.d*b.d); }
function fracSub(a,b){ return makeFrac(a.n*b.d - b.n*a.d, a.d*b.d); }
function fracMul(a,b){ return makeFrac(a.n*b.n, a.d*b.d); }
function fracDiv(a,b){ if(b.n === 0n) throw new Error("0으로 나눌 수 없습니다."); return makeFrac(a.n*b.d, a.d*b.n); }
function fracEq(a,b){ return a.n === b.n && a.d === b.d; }
function fracRound(f, digits){
  var scale = pow10(digits);
  var neg = f.n < 0n, nAbs = neg ? -f.n : f.n;
  var scaledNum = nAbs * scale;
  var q = scaledNum / f.d;
  var r = scaledNum % f.d;
  if(r * 2n >= f.d) q += 1n;
  if(neg) q = -q;
  return makeFrac(q, scale);
}
function fracToNice(f){
  if(f.d === 1n) return f.n.toString();
  var approx = Math.round((Number(f.n)/Number(f.d)) * 10000) / 10000;
  return f.n + "/" + f.d + " (≈" + approx + ")";
}
function answerToFrac(a){
  if(a.type === "int") return fracFromInt(BigInt(Math.round(a.value)));
  if(a.type === "dec") return fracFromDecimal(a.value);
  if(a.type === "frac") return makeFrac(BigInt(Math.round(a.num)), BigInt(Math.round(a.den)));
  if(a.type === "mixed") return fracAdd(fracFromInt(BigInt(Math.round(a.whole))), makeFrac(BigInt(Math.round(a.num)), BigInt(Math.round(a.den))));
  throw new Error("알 수 없는 답 형식: " + a.type);
}

/* 순수 산술식(숫자, + - * / ( ))만 파싱/계산한다. 변수·함수는 절대 허용하지 않는다. */
function evalExpr(str){
  var i = 0, s = String(str == null ? "" : str).trim();
  if(!s) throw new Error("식이 비어 있습니다.");
  function peek(){ while(i < s.length && /\s/.test(s[i])) i++; return s[i]; }
  function parseExpr(){
    var v = parseTerm();
    for(;;){
      var c = peek();
      if(c === "+"){ i++; v = fracAdd(v, parseTerm()); }
      else if(c === "-"){ i++; v = fracSub(v, parseTerm()); }
      else break;
    }
    return v;
  }
  function parseTerm(){
    var v = parseFactor();
    for(;;){
      var c = peek();
      if(c === "*"){ i++; v = fracMul(v, parseFactor()); }
      else if(c === "/"){ i++; v = fracDiv(v, parseFactor()); }
      else break;
    }
    return v;
  }
  function parseFactor(){
    var c = peek();
    if(c === undefined) throw new Error("식이 예상보다 일찍 끝났습니다.");
    if(c === "+"){ i++; return parseFactor(); }
    if(c === "-"){ i++; var f = parseFactor(); return makeFrac(-f.n, f.d); }
    if(c === "("){
      i++; var v = parseExpr();
      if(peek() !== ")") throw new Error("괄호 짝이 맞지 않습니다.");
      i++; return v;
    }
    if(/[0-9]/.test(c)){
      var start = i, seenDot = false;
      while(i < s.length && (/[0-9]/.test(s[i]) || (s[i] === "." && !seenDot))){
        if(s[i] === ".") seenDot = true;
        i++;
      }
      return fracFromDecimalString(s.slice(start, i));
    }
    throw new Error("허용되지 않은 문자입니다: '" + c + "'");
  }
  var result = parseExpr();
  if(peek() !== undefined) throw new Error("식 끝에 알 수 없는 문자가 있습니다: '" + peek() + "'");
  return result;
}
function checkExpr(exprStr, roundDigits, answer){
  try{
    var computed = evalExpr(exprStr);
    var target = (roundDigits != null && roundDigits >= 0) ? fracRound(computed, roundDigits) : computed;
    var expected = answerToFrac(answer);
    return { ok: fracEq(target, expected), computed:computed, expected:expected };
  }catch(e){
    return { ok:false, err:e.message };
  }
}

/* =========================================================
   2. CHOB1 코드 인코딩 (index.html의 디코딩 로직과 정확히 대칭)
   ========================================================= */
var hasCompression = (typeof CompressionStream !== "undefined");
function bufToBase64(buf){
  var bytes = new Uint8Array(buf), chunk = 0x8000, str = "";
  for(var i=0; i<bytes.length; i+=chunk){
    str += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(str);
}
function encodeCode(data){
  var json = JSON.stringify(data);
  var bytes = new TextEncoder().encode(json);
  var cs = new CompressionStream("deflate-raw");
  var stream = new Blob([bytes]).stream().pipeThrough(cs);
  return new Response(stream).arrayBuffer().then(function(buf){
    var b64 = bufToBase64(buf);
    var b64url = b64.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    return "CHOB1:" + b64url;
  });
}

/* =========================================================
   3. Claude API 호출 (브라우저에서 직접 fetch)
   ========================================================= */
var GKEY = "chobly-gen-apikey";
function getApiKey(){ try{ return localStorage.getItem(GKEY) || ""; }catch(e){ return ""; } }
function setApiKey(k){ try{ localStorage.setItem(GKEY, k); }catch(e){} }

var ANSWER_SCHEMA = {
  type:"object",
  properties:{
    type:{type:"string", enum:["int","dec","frac","mixed"]},
    value:{type:"number", description:"type이 int 또는 dec일 때만 사용. 그 외엔 0."},
    whole:{type:"integer", description:"type이 mixed일 때만 사용. 그 외엔 0."},
    num:{type:"integer", description:"type이 frac 또는 mixed일 때만 사용. 그 외엔 0."},
    den:{type:"integer", description:"type이 frac 또는 mixed일 때만 사용. 그 외엔 1."},
    unit:{type:"string", description:"답의 단위. 없으면 빈 문자열."}
  },
  required:["type","value","whole","num","den","unit"],
  additionalProperties:false
};
var STEP_SCHEMA = {
  type:"object",
  properties:{
    title:{type:"string", description:"번호 없이 소제목만. 예: '합계 구하기'"},
    desc:{type:"string", description:"이 단계에서 무엇을, 왜 하는지 한글 설명"},
    math:{type:"string", description:"이 단계의 실제 계산식(여러 줄이면 줄바꿈으로 구분). 없으면 빈 문자열."}
  },
  required:["title","desc","math"],
  additionalProperties:false
};
var SCAN_TOOL = {
  name:"report_scan",
  description:"사진 또는 텍스트에서 인식한 초등학교 5학년 수학 문장제 문제 1개를 구조화해서 보고한다.",
  input_schema:{
    type:"object",
    properties:{
      error:{type:"string", description:"문제를 인식할 수 없을 때(손글씨만 있음/문제가 여러 개/도형 문제/읽을 수 없음) 이유. 정상 인식이면 빈 문자열."},
      text:{type:"string"},
      answer:ANSWER_SCHEMA,
      expression:{type:"string", description:"답을 계산하는 순수 산술식. 숫자와 + - * / ( )만 사용."},
      roundDigits:{type:"integer", description:"반올림이 필요한 문제일 때만 반올림할 소수 자리수. 필요없으면 -1."}
    },
    required:["error","text","answer","expression","roundDigits"],
    additionalProperties:false
  },
  strict:true
};
var GEN_TOOL = {
  name:"report_new_problem",
  description:"원본 문제와 같은 유형으로 새로 만든 초등학교 5학년 수학 문장제 문제 1개를 구조화해서 보고한다.",
  input_schema:{
    type:"object",
    properties:{
      text:{type:"string"},
      answer:ANSWER_SCHEMA,
      expression:{type:"string", description:"답을 계산하는 순수 산술식. 숫자와 + - * / ( )만 사용. 변수·말줄임표 금지."},
      roundDigits:{type:"integer", description:"반올림이 필요한 문제일 때만 반올림할 소수 자리수. 필요없으면 -1."},
      steps:{type:"array", items:STEP_SCHEMA, minItems:2, maxItems:6},
      conclusion:{type:"string", description:"'따라서 ~입니다.' 형식의 최종 결론"}
    },
    required:["text","answer","expression","roundDigits","steps","conclusion"],
    additionalProperties:false
  },
  strict:true
};

var SCAN_SYSTEM = [
"너는 초등학교 5학년 수학 문제지를 스캔해서 구조화된 데이터로 옮기는 도우미야.",
"",
"규칙:",

"3. 인쇄된 문장제 문제를 찾지 못했거나, 손글씨만 있거나, 도형(그림) 문제이거나, 문제를 읽을 수 없으면 마찬가지로 error에 이유를 적어.",
"4. 정상적으로 문제 1개를 인식했으면 error는 빈 문자열(\"\")로 둬.",
"5. text 필드에는 원문 그대로 옮기되, 분수는 \"3/4\"처럼, 대분수는 \"2_1/3\"처럼 적어.",
"6. answer는 문제에서 요구하는 형식대로: 정수는 int, 소수는 dec, 진분수는 frac, 대분수는 mixed.",
"7. expression에는 답을 계산하는 순수 산술식만 적어. 숫자와 + - * / ( )만 쓰고 변수나 말줄임표(...)는 절대 쓰지 마. 이 식을 그대로 계산한 값이 answer와 정확히 같아야 해(반올림이 필요한 문제면 roundDigits에 자리수를 적고, 아니면 -1).",
"8. 확신이 없는 값을 추측해서 채우지 말고 사진/텍스트에 있는 그대로 정직하게 옮겨."
].join("\n");

var GEN_SYSTEM = [
"너는 초등학교 5학년 딸을 위해 수학 문장제 문제를 만드는 도우미야. 주어진 \"원본 문제\"와 같은 유형·난이도로, 숫자와 상황(등장인물, 물건, 장소 등)만 바꾼 새로운 문제 1개를 만들어야 해.",
"",
"[문제 유형 제한]",
"- 반드시 문장제(글로 된 문제)만 만들어. 도형, 각도, 넓이/부피 같은 도형 문제는 만들지 마.",
"- 평균, 분수의 덧셈/뺄셈/곱셈, 소수의 덧셈/뺄셈/곱셈, 비율(백분율) 등 초등학교 5학년 교육과정 범위 안에서만 만들어.",
"- 정답은 주관식으로 하나만 나오게 하고, 원본 문제의 답 형식(정수/소수/분수/대분수)과 같은 형식으로 맞춰.",
"",
"[정확성 — 가장 중요]",
"- expression 필드에는 답을 구하는 순수 산술식만 적어. 숫자와 + - * / ( )만 사용하고 변수(x 등)나 말줄임표는 절대 쓰지 마. 이 식을 그대로 계산한 값이 answer와 정확히 일치해야 해.",
"- 나눗셈이 딱 떨어지지 않는 문제(예: 평균)는 문제에 나오는 숫자 자체를 조정해서 나눗셈이 딱 떨어지도록 만들어. (예: 5명의 평균을 구하는 문제면 합계가 5의 배수가 되도록 숫자를 고름)",
"- 문제 자체가 '반올림하여 ~까지 구하시오'처럼 반올림을 명시적으로 요구할 때만 roundDigits에 반올림할 소수 자리수를 적고, 그 외에는 항상 roundDigits를 -1로 둬(정확히 나누어떨어지는 숫자로 문제를 만들어).",
"- 절대로 계산이 안 맞는데 그럴듯한 숫자로 답을 지어내지 마. expression을 실제로 계산한 값과 answer가 다르면 별도 프로그램이 자동으로 걸러내고 다시 요청할 거야.",
"",
"[풀이(steps) 작성 규칙]",
"- steps는 1단계부터 순서대로, 각 단계는 title(번호 없이 소제목만, 예: '합계 구하기'), desc(그 단계에서 무엇을 왜 하는지 한글로 설명), math(그 단계의 실제 계산식, 여러 줄이면 줄바꿈으로 구분)로 구성해.",
"- 미지수를 쓸 일이 있으면 원칙적으로 x를 사용해. 다만 x로 두면 계산이 오히려 복잡해지는 예외적인 경우에는 그 이유를 desc에 간단히 설명하고, 계산이 더 쉬운 다른 값을 x(또는 a, b, c)로 놓은 뒤 마지막 단계에서 원래 구하려던 값으로 다시 환산해.",
"- conclusion에는 '따라서 ~은 ~입니다.' 형식으로 최종 결론을 적어. 이 값은 answer와 반드시 일치해야 해.",
"- steps와 conclusion에 나오는 숫자도 expression·answer와 서로 앞뒤가 맞아야 해(중간에 값을 슬쩍 바꾸지 마).",
"",
"[표현]",
"- 초등학생이 읽기 편하게 자연스러운 한글 문장으로 써. 분수는 '3/4', 대분수는 '2_1/3' 형식으로 적어.",
"- 등장인물 이름은 실제 아이 이름을 쓰지 말고 일반적인 이름(민수, 지우, 서연 등)을 자유롭게 사용해."
].join("\n");

function claudeCall(system, content, tool, maxTokens){
  var apiKey = getApiKey();
  if(!apiKey) return Promise.reject(new Error("API 키를 먼저 입력해주세요."));
  return fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key": apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({
      model:"claude-opus-5",
      max_tokens: maxTokens || 8000,
      system: system,
      messages:[{role:"user", content: content}],
      tools:[tool],
      tool_choice:{type:"tool", name:tool.name}
    })
  }).catch(function(e){
    throw new Error("네트워크 오류: " + e.message);
  }).then(function(res){
    return res.json().catch(function(){ return null; }).then(function(json){
      if(!res.ok){
        var msg = (json && json.error && json.error.message) || ("HTTP " + res.status);
        if(res.status === 401) msg = "API 키가 올바르지 않아요. 다시 확인해주세요.";
        else if(res.status === 429) msg = "요청이 너무 많아요. 잠시 후 다시 시도해주세요.";
        throw new Error(msg);
      }
      if(!json) throw new Error("응답을 읽지 못했습니다.");
      if(json.stop_reason === "refusal") throw new Error("모델이 이 요청을 거부했어요.");
      var blocks = json.content || [];
      for(var k=0; k<blocks.length; k++){
        if(blocks[k].type === "tool_use" && blocks[k].name === tool.name) return blocks[k].input;
      }
      throw new Error("모델 응답에서 결과를 찾지 못했습니다.");
    });
  });
}

/* =========================================================
   4. 상태
   ========================================================= */
var view = "input";
var base = { text:"", unit:"", type:"int", value:0, whole:0, num:1, den:2, expression:"", roundDigits:-1 };
var count = 1;
var results = [];        // 생성된 문제들
var genProgress = { done:0, total:0, msg:"" };
var expandedIdx = -1;
var title = "";
var busy = false, busyMsg = "";
var exportCode = "";

var wrap = document.getElementById("wrap");
var titleEl = document.getElementById("title");
var countEl = null;
var backBtn = document.getElementById("backBtn");
var gearBtn = document.getElementById("gearBtn");

backBtn.onclick = function(){
  if(busy) return;
  if(view === "confirm") go("input");
  else if(view === "review") go("confirm");
  else if(view === "export") go("review");
};
gearBtn.onclick = function(){ if(!busy) go("input"); };

function go(v){
  view = v;
  render();
  wrap.scrollTop = 0;
}
function setBusy(flag, msg){ busy = flag; busyMsg = msg || ""; render(); }
function busyBannerHTML(){ return busy ? '<div class="note info">' + esc(busyMsg) + '</div>' : ""; }
function defaultTitle(){
  var d = new Date();
  return (d.getMonth()+1) + "/" + d.getDate() + " 수학 문제";
}

/* =========================================================
   5. 렌더링
   ========================================================= */
function render(){
  backBtn.classList.toggle("hide", view === "input");
  gearBtn.classList.toggle("hide", view === "input");
  if(view === "input"){ titleEl.textContent = "문제 만들기"; renderInput(); }
  else if(view === "confirm"){ titleEl.textContent = "확인"; renderConfirm(); }
  else if(view === "review"){ titleEl.textContent = "결과"; renderReview(); }
  else if(view === "export"){ titleEl.textContent = "코드 내보내기"; renderExport(); }
}


function renderInput(){
  var h = '<div class="note info">Claude 채팅에서 생성한 문제 정보를 아래에 입력하세요.</div>';
  h += '<div class="label">문제 제목 (선택)</div>';
  h += '<input type="text" id="inTitle" value="' + esc(title || "") + '" placeholder="예: 분수 나누기">';
  h += '<div class="label">문제 텍스트 *</div>';
  h += '<textarea class="plain" id="inText" rows="4" placeholder="예: 어머니가 우유 3과 1/2리터를 친구 4명에게 똑같이 나누어주려고 합니다. 한 명이 받을 우유는 몇 리터인가요?">' + esc(base.text) + '</textarea>';
  h += '<div class="label">답 형식</div>';
  h += '<select id="inType" style="width:100%;margin-top:7px">';
  ["int","dec","frac","mixed"].forEach(function(t){
    h += '<option value="' + t + '"' + (base.type===t?' selected':'') + '>' + typeLabel(t) + '</option>';
  });
  h += '</select>';
  h += '<div class="fieldrow" style="margin-top:12px"><div class="field"><label>단위 (선택)</label><input type="text" id="inUnit" value="' + esc(base.unit) + '" placeholder="예: 개, cm, 리터"></div></div>';
  h += '<div class="label" style="margin-top:18px">정답</div>';
  h += '<div id="inAnsWrap">' + answerFieldsHTML(base) + '</div>';
  h += '<div class="label" style="margin-top:18px">계산식 *</div>';
  h += '<input type="text" class="mono" id="inExpr" value="' + esc(base.expression) + '" placeholder="예: (88+92+76+95+84)/5">';
  h += '<div class="fieldrow"><div class="field"><label>반올림 (필요없으면 -1)</label><input type="number" id="inRound" value="' + base.roundDigits + '"></div><div class="field"><label>검증</label><div id="inCheck" class="badge"></div></div></div>';
  h += '<div class="label" style="margin-top:18px">풀이 과정</div>';
  h += '<textarea class="plain" id="inSteps" rows="6" placeholder="1단계: ~\n2단계: ~\n..." style="font-size:13px"></textarea>';
  h += '<div class="label" style="margin-top:18px">최종 결론</div>';
  h += '<textarea class="plain" id="inConc" rows="2" placeholder="예: 따라서 한 명이 받을 우유는 7/8리터입니다." style="font-size:13px"></textarea>';
  h += '<button class="btn kid" id="goConfirm">다음 →</button>';
  h += busyBannerHTML();
  wrap.innerHTML = h;

  function bindText(id, key){
    var el = document.getElementById(id);
    el.oninput = function(){ base[key] = el.value; if(id==="inExpr") checkInputNow(); };
  }
  function bindNum(id, key){
    var el = document.getElementById(id);
    el.oninput = function(){
      var v = parseFloat(el.value);
      base[key] = isNaN(v) ? 0 : v;
      checkInputNow();
    };
  }
  bindText("inText","text");
  bindText("inUnit","unit");
  bindText("inExpr","expression");
  document.getElementById("inTitle").oninput = function(){ title = document.getElementById("inTitle").value; };
  document.getElementById("inType").onchange = function(){
    base.type = document.getElementById("inType").value;
    document.getElementById("inAnsWrap").innerHTML = answerFieldsHTML(base);
    wireInputAnswers();
    checkInputNow();
  };
  document.getElementById("inRound").oninput = function(){
    var v = parseInt(document.getElementById("inRound").value,10);
    base.roundDigits = isNaN(v) ? -1 : v;
    checkInputNow();
  };
  function wireInputAnswers(){
    bindNum("inVal","value");
    bindNum("inNum","num");
    bindNum("inDen","den");
    bindNum("inWhole","whole");
  }
  wireInputAnswers();
  document.getElementById("goConfirm").onclick = function(){
    if(!base.text.trim()){ alert("문제 텍스트를 입력해주세요."); return; }
    if(!base.expression.trim()){ alert("계산식을 입력해주세요."); return; }
    go("confirm");
  };
  checkInputNow();
}

function checkInputNow(){
  var badge = document.getElementById("inCheck");
  if(!badge) return;
  if(!base.expression.trim()){ badge.textContent = ""; badge.className = "badge"; return; }
  var chk = checkExpr(base.expression, base.roundDigits, base);
  if(chk.err){
    badge.textContent = "⚠ 식 오류: " + chk.err;
    badge.className = "badge bad";
  }else if(chk.ok){
    badge.textContent = "✅ 일치";
    badge.className = "badge ok";
  }else{
    badge.textContent = "⚠ 불일치";
    badge.className = "badge bad";
  }
}


function answerFieldsHTML(b){
  if(b.type === "int"){
    return '<div class="field"><label>정답</label><input type="number" id="cVal" value="' + b.value + '"></div>';
  }
  if(b.type === "dec"){
    return '<div class="field"><label>정답</label><input type="number" step="any" id="cVal" value="' + b.value + '"></div>';
  }
  if(b.type === "frac"){
    return '<div class="fieldrow" style="margin-top:0"><div class="field"><label>분자</label><input type="number" id="cNum" value="' + b.num + '"></div>'
         + '<div class="field"><label>분모</label><input type="number" id="cDen" value="' + b.den + '"></div></div>';
  }
  return '<div class="fieldrow" style="margin-top:0"><div class="field"><label>자연수</label><input type="number" id="cWhole" value="' + b.whole + '"></div>'
       + '<div class="field"><label>분자</label><input type="number" id="cNum" value="' + b.num + '"></div>'
       + '<div class="field"><label>분모</label><input type="number" id="cDen" value="' + b.den + '"></div></div>';
}

function renderConfirm(){
  var h = '<div class="note info">문제 정보를 확인하세요.</div>';
  h += '<div class="card">';
  h += '<div class="n">' + (title || "문제") + '</div>';
  h += '<div class="m">형식: ' + typeLabel(base.type) + (base.unit ? (' · 단위: ' + esc(base.unit)) : '') + '</div>';
  h += '</div>';
  h += '<div class="label">문제</div>';
  h += '<div class="card" style="cursor:default">' + fracHTML(base.text) + '</div>';
  h += '<div class="label">정답</div>';
  h += '<div class="card" style="cursor:default">' + fracHTML(answerTextFlat(base)) + (base.unit ? (' ' + esc(base.unit)) : '') + '</div>';
  h += '<div class="label">계산식 및 반올림</div>';
  h += '<div class="card mono" style="cursor:default;font-size:13px">' + esc(base.expression) + '<br>반올림: ' + base.roundDigits + '</div>';
  h += '<div class="label">만들 문제 개수</div>';
  h += '<input type="number" id="genCount" min="1" max="10" value="' + count + '" style="width:100%;margin-top:7px">';
  h += '<div class="row" style="margin-top:18px">';
  h += '<button class="btn ghost" id="goBack">← 수정</button>';
  h += '<button class="btn kid" id="startGen">생성 시작 →</button>';
  h += '</div>';
  h += busyBannerHTML();
  wrap.innerHTML = h;

  document.getElementById("genCount").oninput = function(){
    var n = parseInt(document.getElementById("genCount").value,10);
    if(isNaN(n) || n < 1) n = 1;
    if(n > 10) n = 10;
    count = n;
  };
  document.getElementById("goBack").onclick = function(){ if(!busy) go("input"); };
  document.getElementById("startGen").onclick = function(){
    if(busy) return;
    var n = parseInt(document.getElementById("genCount").value,10);
    if(isNaN(n) || n < 1) n = 1;
    if(n > 10) n = 10;
    count = n;
    var data = {
      id: String(Date.now()),
      title: title || defaultTitle(),
      q: [{
        text: base.text,
        answer: { type:base.type, value:base.value, whole:base.whole, num:base.num, den:base.den, unit:base.unit },
        steps: [],
        conclusion: ""
      }]
    };
    setBusy(true, "코드 만드는 중…");
    encodeCode(data).then(function(code){
      exportCode = code;
      setBusy(false);
      go("export");
    }).catch(function(e){
      setBusy(false);
      alert("코드 생성 실패: " + e.message);
    });
  };
}


function renderExport(){
  var h = '<div class="note good">코드가 준비됐어요! 아래 내용을 전체 복사해서 카톡으로 초연이에게 보내주세요.</div>';
  h += '<div class="label">CHOB1 코드</div>';
  h += '<textarea id="codeBox" readonly>' + esc(exportCode) + '</textarea>';
  h += '<button class="btn kid" id="copyBtn">복사하기</button>';
  h += '<button class="btn ghost" id="newOne">새 문제 만들기</button>';
  wrap.innerHTML = h;

  document.getElementById("copyBtn").onclick = function(){
    var btn = document.getElementById("copyBtn");
    function ok(){ var old = btn.textContent; btn.textContent = "복사됐어요 ✓"; setTimeout(function(){ btn.textContent = old; }, 1500); }
    function fallback(){
      var el = document.getElementById("codeBox");
      el.select(); el.setSelectionRange(0, 999999);
      try{ document.execCommand("copy"); ok(); }
      catch(e){ alert("복사에 실패했어요. 직접 선택해서 복사해주세요."); }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(exportCode).then(ok).catch(fallback);
    }else{
      fallback();
    }
  };
  document.getElementById("newOne").onclick = function(){
    img = null; scanError = ""; expandedIdx = -1;
    base = { text:"", unit:"", type:"int", value:0, whole:0, num:1, den:2, expression:"", roundDigits:-1 };
    results = []; genProgress = { done:0, total:0, msg:"" }; title = ""; exportCode = "";
    go("input");
  };
}

/* ---------- 시작 ---------- */
render();
</script>
