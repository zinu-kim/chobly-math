<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chobly Math - 부모</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4CAF50">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4CAF50;
      --primary-dark: #388E3C;
      --secondary: #2196F3;
      --error: #F44336;
      --warning: #FF9800;
      --success: #4CAF50;
      --neutral-bg: #F5F5F5;
      --neutral-text: #333333;
      --neutral-border: #DDDDDD;
      --neutral-light: #EEEEEE;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--neutral-bg);
      color: var(--neutral-text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      background: var(--primary);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 24px;
      min-height: 400px;
    }

    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 8px;
    }

    .step {
      flex: 1;
      height: 4px;
      background: var(--neutral-light);
      border-radius: 2px;
    }

    .step.active {
      background: var(--primary);
    }

    .step.completed {
      background: var(--success);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input[type="file"],
    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--neutral-border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .image-preview {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 6px;
      margin-top: 8px;
      background: var(--neutral-light);
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-primary:disabled {
      background: #BDBDBD;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-secondary {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-secondary:hover {
      background: var(--neutral-light);
    }

    .message-box {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .message-info {
      background: #E3F2FD;
      color: #1565C0;
      border-left: 4px solid var(--secondary);
    }

    .message-success {
      background: #E8F5E9;
      color: #2E7D32;
      border-left: 4px solid var(--success);
    }

    .message-error {
      background: #FFEBEE;
      color: #C62828;
      border-left: 4px solid var(--error);
    }

    .problem-list {
      margin-top: 16px;
    }

    .problem-item {
      padding: 12px;
      background: var(--neutral-light);
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .problem-item .new-badge {
      background: var(--secondary);
      color: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
    }

    .step-1 { display: none; }
    .step-1.active { display: block; }

    .step-2 { display: none; }
    .step-2.active { display: block; }

    .step-3 { display: none; }
    .step-3.active { display: block; }

    .step-4 { display: none; }
    .step-4.active { display: block; }

    .step-5 { display: none; }
    .step-5.active { display: block; }

    @media (max-width: 480px) {
      .content {
        padding: 16px;
      }

      .button-group {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>초연이의 수학 문제 생성</h1>
      <p>부모용 앱</p>
    </div>

    <div class="content">
      <div class="step-indicator">
        <div class="step active" id="step-1-indicator"></div>
        <div class="step" id="step-2-indicator"></div>
        <div class="step" id="step-3-indicator"></div>
        <div class="step" id="step-4-indicator"></div>
        <div class="step" id="step-5-indicator"></div>
      </div>

      <!-- Step 1: Photo Upload -->
      <div class="step-1 active">
        <h2 style="margin-bottom: 16px;">1단계: 문제 사진 업로드</h2>

        <div class="form-group">
          <label for="photo-input">사진을 선택하세요</label>
          <input type="file" id="photo-input" accept="image/*">
          <div id="photo-preview-container"></div>
        </div>

        <div class="message-info">
          📱 카메라나 갤러리에서 사진을 선택하세요
        </div>

        <div class="button-group">
          <button class="btn-primary" id="btn-next-1" disabled>다음</button>
        </div>
      </div>

      <!-- Step 2: Confirm Photo -->
      <div class="step-2">
        <h2 style="margin-bottom: 16px;">2단계: 사진 확인</h2>

        <div style="text-align: center;">
          <img id="confirm-photo" alt="확인용 사진" style="max-width: 100%; max-height: 300px; border-radius: 6px;">
        </div>

        <div class="message-info" style="margin-top: 16px;">
          📋 사진이 명확한가요? 문제들이 잘 보이나요?
        </div>

        <div class="button-group">
          <button class="btn-secondary" id="btn-back-2">다시 선택</button>
          <button class="btn-primary" id="btn-next-2">확인</button>
        </div>
      </div>

      <!-- Step 3: Generate Problems -->
      <div class="step-3">
        <h2 style="margin-bottom: 16px;">3단계: Claude에 요청</h2>

        <div class="message-info">
          🤖 다음 프롬프트를 Claude에 복사하여 실행하세요:
        </div>

        <div style="background: var(--neutral-light); padding: 12px; border-radius: 6px; margin: 16px 0; font-family: monospace; font-size: 11px; max-height: 200px; overflow-y: auto;">
          <div id="prompt-text"></div>
        </div>

        <button class="btn-secondary" id="btn-copy-prompt" style="margin-bottom: 12px; width: 100%;">📋 프롬프트 복사</button>

        <div class="form-group">
          <label for="ai-response">Claude의 응답을 붙여넣기</label>
          <textarea id="ai-response" placeholder="Claude의 답변을 여기에 붙여넣으세요..."></textarea>
        </div>

        <div class="button-group">
          <button class="btn-secondary" id="btn-back-3">뒤로</button>
          <button class="btn-primary" id="btn-next-3" disabled>다음</button>
        </div>
      </div>

      <!-- Step 4: Select Problems -->
      <div class="step-4">
        <h2 style="margin-bottom: 16px;">4단계: 문제 선택</h2>

        <div class="message-info">
          ✅ 초연이에게 보낼 문제를 선택하세요
        </div>

        <div id="problem-select-list" style="margin-top: 16px;"></div>

        <div class="button-group">
          <button class="btn-secondary" id="btn-back-4">뒤로</button>
          <button class="btn-primary" id="btn-next-4" disabled>다음</button>
        </div>
      </div>

      <!-- Step 5: Share Code -->
      <div class="step-5">
        <h2 style="margin-bottom: 16px;">5단계: 공유</h2>

        <div class="message-success">
          ✅ 공유 코드를 만들었습니다!
        </div>

        <div style="background: #E8F5E9; padding: 16px; border-radius: 6px; margin: 16px 0; text-align: center;">
          <div style="font-size: 12px; color: #666; margin-bottom: 8px;">공유 코드</div>
          <div id="share-code" style="font-family: monospace; font-size: 16px; font-weight: bold; word-break: break-all; color: var(--primary);"></div>
        </div>

        <button class="btn-secondary" id="btn-copy-code" style="margin-bottom: 12px; width: 100%;">📋 코드 복사</button>

        <div class="message-info">
          💬 이 코드를 초연이에게 카톡으로 보내거나 공유하세요
        </div>

        <div style="margin-top: 16px;">
          <h3 style="font-size: 14px; margin-bottom: 8px;">최근 문제</h3>
          <div id="recent-problems" class="problem-list"></div>
        </div>

        <div class="button-group">
          <button class="btn-secondary" id="btn-new-problem" style="width: 100%;">새 문제 생성</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/storage.js"></script>
  <script src="../shared/validator.js"></script>
  <script>
    // Register service worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.log('Service Worker registration failed:', err);
      });
    }
  </script>
  <script>
    let currentStep = 1;
    let selectedPhoto = null;
    let selectedProblems = [];
    let generatedProblems = [];

    function updateStepIndicator() {
      for (let i = 1; i <= 5; i++) {
        const indicator = document.getElementById(`step-${i}-indicator`);
        if (i < currentStep) {
          indicator.classList.add('completed');
          indicator.classList.remove('active');
        } else if (i === currentStep) {
          indicator.classList.add('active');
          indicator.classList.remove('completed');
        } else {
          indicator.classList.remove('active', 'completed');
        }
      }
    }

    function showStep(step) {
      document.querySelectorAll('[class*="step-"]').forEach(el => {
        if (el.classList.contains(`step-${step}`)) {
          el.classList.add('active');
        } else if (el.classList.contains('step-') && el.classList.contains('active')) {
          el.classList.remove('active');
        }
      });
      currentStep = step;
      updateStepIndicator();
    }

    // Step 1: Photo Upload
    document.getElementById('photo-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          selectedPhoto = event.target.result;
          const preview = document.createElement('img');
          preview.src = selectedPhoto;
          preview.className = 'image-preview';
          document.getElementById('photo-preview-container').innerHTML = '';
          document.getElementById('photo-preview-container').appendChild(preview);
          document.getElementById('btn-next-1').disabled = false;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('btn-next-1').addEventListener('click', () => {
      showStep(3);
      generatePrompt();
    });

    // Step 2: Confirm Photo
    document.getElementById('btn-back-2').addEventListener('click', () => {
      showStep(1);
    });

    document.getElementById('btn-next-2').addEventListener('click', () => {
      showStep(3);
      generatePrompt();
    });

    function generatePrompt() {
      const prompt = `다음 사진을 분석하여 초등학교 5학년 수학 문제를 생성해주세요.

[사진 분석 후]
JSON 형식으로 3-5개의 새로운 비슷한 수준의 문제를 생성하세요.

응답 형식 (JSON만 제공):
[
  {
    "question": "문제 텍스트",
    "answer": "정답 (숫자만)",
    "unit": "단위 (없으면 빈 문자열)",
    "type": "integer|decimal|fraction|mixed",
    "explanation": "풀이 과정"
  }
]`;

      document.getElementById('prompt-text').textContent = prompt;
    }

    document.getElementById('btn-copy-prompt').addEventListener('click', () => {
      const prompt = document.getElementById('prompt-text').textContent;
      navigator.clipboard.writeText(prompt).then(() => {
        alert('프롬프트가 복사되었습니다!');
      });
    });

    document.getElementById('ai-response').addEventListener('input', () => {
      document.getElementById('btn-next-3').disabled =
        !document.getElementById('ai-response').value.trim();
    });

    // Step 3: Process AI Response
    document.getElementById('btn-back-3').addEventListener('click', () => {
      showStep(2);
    });

    document.getElementById('btn-next-3').addEventListener('click', () => {
      const response = document.getElementById('ai-response').value;
      try {
        const match = response.match(/\[[\s\S]*\]/);
        if (match) {
          generatedProblems = JSON.parse(match[0]);
          showStep(4);
          displayProblemsForSelection();
        } else {
          alert('문제를 찾을 수 없습니다. 다시 확인해주세요.');
        }
      } catch (e) {
        alert('응답 형식이 잘못되었습니다.');
      }
    });

    function displayProblemsForSelection() {
      const container = document.getElementById('problem-select-list');
      container.innerHTML = '';
      selectedProblems = [];

      generatedProblems.forEach((problem, index) => {
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `problem-${index}`;
        checkbox.checked = true;

        const updateButton = () => {
          selectedProblems = [];
          generatedProblems.forEach((_, i) => {
            if (document.getElementById(`problem-${i}`)?.checked) {
              selectedProblems.push(i);
            }
          });
          document.getElementById('btn-next-4').disabled = selectedProblems.length === 0;
        };

        checkbox.addEventListener('change', updateButton);

        const label = document.createElement('label');
        label.htmlFor = `problem-${index}`;
        label.style.marginLeft = '8px';
        label.textContent = `${problem.question.substring(0, 50)}...`;

        const item = document.createElement('div');
        item.style.padding = '12px';
        item.style.background = 'var(--neutral-light)';
        item.style.borderRadius = '6px';
        item.style.marginBottom = '8px';
        item.style.display = 'flex';
        item.style.alignItems = 'center';
        item.appendChild(checkbox);
        item.appendChild(label);

        container.appendChild(item);
      });

      selectedProblems = [];
      generatedProblems.forEach((_, index) => {
        selectedProblems.push(index);
      });
      document.getElementById('btn-next-4').disabled = false;
    }

    // Step 4: Select Problems
    document.getElementById('btn-back-4').addEventListener('click', () => {
      showStep(3);
    });

    document.getElementById('btn-next-4').addEventListener('click', () => {
      const selected = selectedProblems.map(i => generatedProblems[i]);
      const problemSet = {
        problems: selected,
        photoUrl: selectedPhoto
      };

      const shareData = {
        version: 1,
        problems: selected,
        createdAt: new Date().toISOString()
      };

      const shareCode = Storage.encodeShareData(shareData);
      document.getElementById('share-code').textContent = shareCode;

      Storage.saveParentProblemSet(problemSet);
      showStep(5);
      displayRecentProblems();
    });

    // Step 5: Share
    document.getElementById('btn-copy-code').addEventListener('click', () => {
      const code = document.getElementById('share-code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        alert('공유 코드가 복사되었습니다!');
      });
    });

    document.getElementById('btn-new-problem').addEventListener('click', () => {
      currentStep = 1;
      selectedPhoto = null;
      selectedProblems = [];
      generatedProblems = [];
      document.getElementById('photo-input').value = '';
      document.getElementById('photo-preview-container').innerHTML = '';
      document.getElementById('ai-response').value = '';
      document.getElementById('btn-next-1').disabled = true;
      showStep(1);
    });

    function displayRecentProblems() {
      const sets = Storage.getParentProblemSets();
      const container = document.getElementById('recent-problems');
      container.innerHTML = '';

      sets.slice(0, 3).forEach(set => {
        const item = document.createElement('div');
        item.className = 'problem-item';

        const text = document.createElement('div');
        text.textContent = `${set.problems.length}개 문제 생성됨`;

        const badge = document.createElement('div');
        if (set.isNew) {
          const newBadge = document.createElement('span');
          newBadge.className = 'new-badge';
          newBadge.textContent = 'NEW';
          badge.appendChild(newBadge);
        }

        item.appendChild(text);
        item.appendChild(badge);
        container.appendChild(item);
      });
    }
  </script>
</body>
</html>
