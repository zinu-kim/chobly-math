<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>초연이의 수학문제 생성기</title>
<meta name="theme-color" content="#2E7D5B">
<link rel="stylesheet" href="shared/style.css">
<style>
  .pickapp {
    display: block; text-decoration: none; color: inherit;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper); padding: 18px; margin-bottom: 12px;
  }
  .pickapp .k { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .pickapp .n { font-size: 18px; font-weight: 700; margin: 4px 0 4px; }
  .pickapp .d { font-size: 13.5px; color: var(--ink-soft); }
  .dad .k { color: #2E7D5B; }
  .kid .k { color: #2B6CB0; }
  ol { padding-left: 20px; font-size: 14px; line-height: 1.9; }
  ol b { font-weight: 700; }
</style>
</head>
<body>

<div class="top"><div class="top-inner">
  <h1>초연이의 수학문제 생성기</h1>
  <p>쓸 앱을 고르세요</p>
</div></div>

<div class="wrap">
  <a class="pickapp dad" href="parent/">
    <div class="k">아빠</div>
    <div class="n">문제 만들기</div>
    <div class="d">사진에서 문제를 읽고, 비슷한 문제를 만들어 초연이에게 보냅니다.</div>
  </a>

  <a class="pickapp kid" href="kid/">
    <div class="k">초연이</div>
    <div class="n">문제 풀기</div>
    <div class="d">아빠가 보낸 코드를 붙여넣고 문제를 풉니다.</div>
  </a>

  <div class="card">
    <h2 class="title" style="font-size:15px">홈 화면에 앱처럼 깔기</h2>
    <ol style="margin-top:10px">
      <li>위에서 쓸 앱을 열어요.</li>
      <li>브라우저 <b>메뉴(⋮)</b>를 누르고 <b>홈 화면에 추가</b>를 고릅니다.</li>
      <li>홈 화면에 아이콘이 생깁니다.</li>
    </ol>
    <p class="muted" style="margin-top:10px">
      아빠 폰에는 <b>문제 만들기</b>, 초연이 폰에는 <b>문제 풀기</b>를 각각 깔면 됩니다.
    </p>
  </div>

  <div id="cleanup"></div>
</div>

<script>
// 예전에 깔았던 루트 서비스워커가 낡은 화면을 계속 보여주는 것을 막는다.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    const stale = regs.filter(r => {
      const p = new URL(r.scope).pathname;
      return !/\/(parent|kid)\/$/.test(p);
    });
    if (!stale.length) return;
    Promise.all(stale.map(r => r.unregister())).then(() => {
      if (window.caches) {
        caches.keys().then(keys =>
          Promise.all(keys.filter(k => !/parent|kid/.test(k)).map(k => caches.delete(k))));
      }
      document.getElementById('cleanup').innerHTML =
        '<div class="note ok">예전 버전 정리를 마쳤습니다. 화면을 한 번 새로고침해 주세요.</div>';
    });
  }).catch(() => {});
}
</script>
</body>
</html>
